<!doctype html>
<meta charset="utf-8">
<title>Oriel IPC test</title>
<pre id="out">running…</pre>
<script>
  // Captured before any await: contextBridge exposures must exist before page scripts run.
  const exposedAtStart = typeof window.api === 'object';
  const results = [];
  const check = (name, pass, detail) => results.push({ name, pass: !!pass, detail: String(detail ?? '') });

  // Electron's proxied function keeps its original alive only while the proxy is reachable. gc() is V8's, from the
  // --js-flags=--expose-gc this app appends; a collection is isolate-wide, so it reaches the preload's world too.
  const collected = new Set();
  const watched = new FinalizationRegistry((tag) => collected.add(tag));
  const sendAway = (tag, to) => {
    const fn = (x) => tag + ':' + x;
    watched.register(fn, tag);
    to(fn);
  };
  const collectUntil = async (done) => {
    for (let i = 0; i < 100 && !done(); i++) {
      gc();
      await new Promise((resolve) => setTimeout(resolve, 20));
    }
    return done();
  };
  const bridgeLifetime = async () => {
    if (typeof gc !== 'function') { check('bridge lifetime: gc() is exposed', false, typeof gc); return; }
    sendAway('page-dropped', api.hold);
    api.drop();
    sendAway('page-kept', api.keep);
    api.make('preload-dropped');
    const keptProxy = api.make('preload-kept');
    const released = await collectUntil(() => collected.has('page-dropped') && api.collected('preload-dropped'));
    check('bridge lifetime: a page function is released once the preload drops its proxy', collected.has('page-dropped'), [...collected]);
    check('bridge lifetime: a preload function is released once the page drops its proxy', api.collected('preload-dropped'), released);
    let keptAnswer;
    try { keptAnswer = api.callKept(5); } catch (e) { keptAnswer = e.message; }
    check('bridge lifetime: a proxy the preload still holds keeps working after gc', keptAnswer === 'page-kept:5' && !collected.has('page-kept'), keptAnswer);
    let madeAnswer;
    try { madeAnswer = keptProxy(); } catch (e) { madeAnswer = e.message; }
    check('bridge lifetime: a proxy the page still holds keeps working after gc', madeAnswer === 'made:preload-kept' && !api.collected('preload-kept'), madeAnswer);

    const f = () => 0;
    check('bridge identity: one function twice in one crossing is one proxy', api.same(f, f), api.same(f, f));
    check('bridge identity: a proxy sent back arrives as the original', api.echo(f) === f, api.echo(f) === f);
    api.sameAsLast(f);
    const again = api.sameAsLast(f);
    api.forgetLast();
    check('bridge identity: each crossing makes a new proxy', again === false, again);

    // Electron's ObjectCache: one copy per object per crossing, so shared and cyclic objects keep their shape.
    const shared = { n: 1 };
    const cyclic = { a: shared, b: shared, list: [shared, shared] };
    cyclic.self = cyclic;
    let shape;
    try { shape = api.shapeOf(cyclic); } catch (e) { shape = e.message; }
    check('bridge objects: a repeated, cyclic or listed-twice object arrives as one copy',
      shape?.shared === true && shape?.cyclic === true && shape?.arrayShared === true, JSON.stringify(shape));
    let made;
    try { made = api.makeCycle(); } catch (e) { made = e.message; }
    check('bridge objects: a cyclic return value keeps its shape',
      made?.self === made && made?.twice?.[0] === made?.twice?.[1] && made?.name === 'made', typeof made === 'string' ? made : Object.keys(made ?? {}));
    api.sameAsLastObject(shared);
    const objectAgain = api.sameAsLastObject(shared);
    check('bridge objects: each crossing makes a new copy', objectAgain === false, objectAgain);

    // A proxied promise that never settles must not outlive the page's last reference to it.
    watched.register(api.never(), 'never-proxy');
    const later = api.later();
    const neverCollected = await collectUntil(() => collected.has('never-proxy'));
    check('bridge promises: an unsettled proxied promise nothing holds is collected', neverCollected, [...collected]);
    api.settle(7);
    const settled = await Promise.race([later, new Promise((resolve) => setTimeout(() => resolve('timeout'), 2000))]);
    check('bridge promises: a held proxied promise still settles after gc', settled === 7, settled);
  };

  (async () => {
    check('api exposed before page scripts', exposedAtStart, typeof window.api);
    check('binding hidden from page', typeof window.__orielIpc === 'undefined', typeof window.__orielIpc);
    check('oriel runtime hidden from page', typeof window.oriel === 'undefined', typeof window.oriel);
    check('deliver hook hidden from page', typeof window.__orielDeliver === 'undefined', typeof window.__orielDeliver);
    check('exposed value crosses', window.api?.version === 1, window.api?.version);
    check('exposed api is frozen', Object.isFrozen(window.api), Object.isFrozen(window.api));

    try { const v = await api.ping('hello'); check('invoke round trip (string)', v === 'pong:hello', v); }
    catch (e) { check('invoke round trip (string)', false, e.message); }

    try { const v = await api.add(2, 3); check('invoke round trip (numbers)', v === 5, v); }
    catch (e) { check('invoke round trip (numbers)', false, e.message); }

    try { await api.fail(); check('handler exception rejects', false, 'resolved'); }
    catch (e) { check('handler exception rejects', /boom/.test(e.message), e.message); }

    try { await api.unhandled(); check('missing handler rejects', false, 'resolved'); }
    catch (e) { check('missing handler rejects', /No handler registered/.test(e.message), e.message); }

    const tick = await Promise.race([
      new Promise((resolve) => api.onTick(resolve)),
      new Promise((resolve) => setTimeout(() => resolve('timeout'), 5000)),
    ]);
    check('send + webContents.send + callback', tick === 42, tick);

    await bridgeLifetime();

    document.getElementById('out').textContent = JSON.stringify(results, null, 2);
    await api.report(results);
  })();
</script>
